<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mindspace — Write what comes to mind.</title>
        <script src="./theme-init.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@400;700&family=Outfit:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./dashboard.css" />
        <link rel="stylesheet" href="./home.css" />
    </head>
    <body>
        <canvas id="dust-canvas" aria-hidden="true"></canvas>
        <main>
            <section class="home-hero" aria-labelledby="home-title">
                <div class="hero-glow" aria-hidden="true"></div>
                <div class="home-content">
                    <p class="home-kicker">Mindspace</p>
                    <h1 id="home-title" class="home-title" aria-label="Write what comes to mind.">
                        <span id="typewriter-text"></span><span class="typewriter-cursor" aria-hidden="true"></span>
                    </h1>
                    <p class="home-description">
                        A focused, local workspace for the ideas worth keeping.
                    </p>
                    <div class="home-actions">
                        <a class="home-cta" href="./index.html">Open Mindspace <span aria-hidden="true">→</span></a>
                        <a class="home-secondary-cta" href="#documents">Your documents <span aria-hidden="true">↓</span></a>
                    </div>
                </div>
            </section>

            <section id="documents" class="dashboard" aria-labelledby="documents-title">
                <header class="dashboard-header">
                    <div class="dashboard-header-title">
                        <p class="documents-kicker">Mindspace</p>
                        <h2 id="documents-title">Your documents</h2>
                        <p class="dashboard-subtitle">Manage, edit, and organize your local documents.</p>
                    </div>
                    <button id="new-doc-btn" class="new-doc-btn" type="button">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New document</span>
                    </button>
                </header>

                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon" aria-hidden="true">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </div>
                    <h3>No documents yet</h3>
                    <p>Start writing by creating your first document.</p>
                    <button id="empty-new-doc-btn" class="new-doc-btn" type="button">Create your first document</button>
                </div>

                <ul id="doc-list" class="doc-list"></ul>
            </section>
        </main>
        <script src="./home.js"></script>
        <script src="./DashboardView.js" type="module"></script>
    </body>
</html>
